<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Medium Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="navbar reading-nav">
        <div class="nav-container">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <svg viewBox="0 0 1043.63 592.71" width="45" height="25">
                        <path d="M588.67 296.36c0 163.67-131.78 296.35-294.33 296.35S0 460 0 296.36 131.78 0 294.34 0s294.33 132.69 294.33 296.36M911.56 296.36c0 154.06-65.89 279-147.17 279s-147.17-124.94-147.17-279 65.88-279 147.16-279 147.17 124.9 147.17 279M1043.63 296.36c0 138-23.17 249.94-51.76 249.94s-51.75-111.91-51.75-249.94 23.17-249.94 51.75-249.94 51.76 111.9 51.76 249.94" fill="var(--text-primary)"/>
                    </svg>
                </a>
            </div>
            <div class="nav-right" id="nav-right">
                <!-- Injected by auth.js -->
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <a href="#" class="sidebar-link active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Platform Overview
                </a>
                <a href="#" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Users
                </a>
                <a href="#" class="sidebar-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Articles
                </a>
            </div>
        </aside>

        <main class="dashboard-content">
            <div class="dashboard-header">
                <div>
                    <h1 style="font-family: var(--font-sans);">Admin Control Panel</h1>
                    <p style="color: var(--text-secondary);">Manage platform content and users.</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="label">Total Writers</div>
                    <div class="value">42,810</div>
                </div>
                <div class="stat-card">
                    <div class="label">Published Stories</div>
                    <div class="value">145.2K</div>
                </div>
                <div class="stat-card" style="border-color: #ef4444;">
                    <div class="label" style="color: #ef4444;">Flagged Content</div>
                    <div class="value">18</div>
                </div>
            </div>

            <h3 style="margin-bottom: 16px;">User Management</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            if (!user || user.role !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            const users = JSON.parse(localStorage.getItem('medium_users') || '[]');
            const tbody = document.getElementById('users-tbody');
            
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: var(--text-muted);">#${u.id}</td>
                    <td style="font-weight: 500; color: var(--text-primary);">${u.username}</td>
                    <td>${u.email}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'admin' : 'active'}">${u.role}</span></td>
                    <td><button style="color: #ef4444; font-size: 12px; font-weight: 600;">BAN</button></td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
