<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium Clone — Where good ideas find you.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Top Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="/" class="logo">
                    <svg viewBox="0 0 1043.63 592.71" width="45" height="25">
                        <path d="M588.67 296.36c0 163.67-131.78 296.35-294.33 296.35S0 460 0 296.36 131.78 0 294.34 0s294.33 132.69 294.33 296.36M911.56 296.36c0 154.06-65.89 279-147.17 279s-147.17-124.94-147.17-279 65.88-279 147.16-279 147.17 124.9 147.17 279M1043.63 296.36c0 138-23.17 249.94-51.76 249.94s-51.75-111.91-51.75-249.94 23.17-249.94 51.75-249.94 51.76 111.9 51.76 249.94" fill="#000"/>
                    </svg>
                    <span class="logo-text">Medium</span>
                </a>
            </div>
            <div class="nav-right" id="nav-right">
                <a href="#" class="nav-link hidden-mobile">Our story</a>
                <a href="#" class="nav-link hidden-mobile">Membership</a>
                <a href="#" class="nav-link hidden-mobile">Write</a>
                <a href="#" class="nav-link">Sign In</a>
                <button class="btn-primary">Get started</button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>Stay curious.</h1>
            <p>Discover stories, thinking, and expertise from writers on any topic.</p>
            <button class="btn-primary btn-large">Start reading</button>
        </div>
        <div class="hero-animation" id="hero-animation">
            <!-- Dynamic M letters injected by JS -->
        </div>
    </section>

    <!-- Trending Section -->
    <section class="trending-section">
        <div class="container">
            <div class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                <span>Trending on Medium</span>
            </div>
            <div class="trending-grid" id="trending-grid">
                <!-- Trending articles injected by JS -->
            </div>
        </div>
    </section>

    <!-- Main Content Layout -->
    <main class="main-layout container">
        <div class="feed-section">
            <div class="feed-header">
                <button class="feed-tab active">Following</button>
                <button class="feed-tab">Recommended for you</button>
            </div>
            <div class="article-feed" id="article-feed">
                <!-- Articles injected by JS -->
            </div>
        </div>
    </main>

    <!-- Site Footer -->
    <footer style="background: var(--bg-secondary); padding: 40px 20px; border-top: 1px solid var(--border-dark); margin-top: 80px;">
        <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <div class="logo">
                <svg viewBox="0 0 1043.63 592.71" width="45" height="25">
                    <path d="M588.67 296.36c0 163.67-131.78 296.35-294.33 296.35S0 460 0 296.36 131.78 0 294.34 0s294.33 132.69 294.33 296.36M911.56 296.36c0 154.06-65.89 279-147.17 279s-147.17-124.94-147.17-279 65.88-279 147.16-279 147.17 124.9 147.17 279M1043.63 296.36c0 138-23.17 249.94-51.76 249.94s-51.75-111.91-51.75-249.94 23.17-249.94 51.75-249.94 51.76 111.9 51.76 249.94" fill="var(--text-secondary)"/>
                </svg>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; font-size: 14px; max-width: 800px;">
                <a href="/our-story" style="color: var(--text-secondary);">Our Story</a>
                <a href="/membership" style="color: var(--text-secondary);">Membership</a>
                <a href="/write" style="color: var(--text-secondary);">Write</a>
                <a href="/login" style="color: var(--text-secondary);">Sign In</a>
                <a href="#" style="color: var(--text-secondary);">Help</a>
                <a href="#" style="color: var(--text-secondary);">Status</a>
                <a href="#" style="color: var(--text-secondary);">About</a>
                <a href="#" style="color: var(--text-secondary);">Careers</a>
                <a href="#" style="color: var(--text-secondary);">Blog</a>
                <a href="#" style="color: var(--text-secondary);">Privacy</a>
                <a href="#" style="color: var(--text-secondary);">Terms</a>
                <a href="#" style="color: var(--text-secondary);">Text to speech</a>
                <a href="#" style="color: var(--text-secondary);">Teams</a>
            </div>
            <div style="font-size: 12px; color: var(--text-muted);">&copy; 2026 Medium Clone Project.</div>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
